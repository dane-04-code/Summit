<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#FAFAF8;color:#15161A;
    -webkit-font-smoothing:antialiased}
  .phone{width:390px;height:844px;display:flex;flex-direction:column;justify-content:center;
    padding:0 28px;margin:0 auto}
  .mark{width:60px;height:60px;border-radius:18px;background:#4F46E5;display:flex;
    align-items:center;justify-content:center;margin-bottom:26px;
    box-shadow:0 8px 24px rgba(79,70,229,.28)}
  .name{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#9A9AA2;
    font-weight:600;margin-bottom:10px}
  h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}
  .sub{font-size:15px;line-height:21px;color:#86868E;margin-bottom:34px}
  label{display:block;font-size:13px;font-weight:500;color:#6A6A72;margin:0 0 7px 2px}
  .field{margin-bottom:16px}
  .input{width:100%;height:54px;background:#fff;border:1px solid #ECEAE4;border-radius:14px;
    padding:0 16px;font-size:16px;color:#15161A;display:flex;align-items:center;
    box-shadow:0 1px 2px rgba(20,20,30,.03)}
  .input.ph{color:#AEAEB4}
  .eye{width:24px;height:24px;flex:none;color:#AEAEB4}
  .help{display:flex;align-items:center;gap:6px;font-size:14px;color:#4F46E5;font-weight:600;
    margin:6px 2px 0}
  .btn{margin-top:30px;height:54px;border-radius:14px;background:#4F46E5;color:#fff;
    font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(79,70,229,.30)}
</style></head><body>
  <div class="phone">
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
    </div>
    <div class="name">Agent Messenger</div>
    <h1>Connect your agent</h1>
    <div class="sub">Point the app at your self-hosted Hermes server.</div>

    <div class="field"><label>Host</label>
      <div class="input ph">my-hermes.home:8642</div></div>
    <div class="field"><label>API key</label>
      <div class="input"><span class="ph" style="flex:1">your-secret-key</span>
        <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </div></div>

    <div class="help">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      Where do I find these?
    </div>

    <div class="btn">Test connection</div>
  </div>
</body></html>
