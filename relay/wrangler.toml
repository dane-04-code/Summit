name = "summit-relay"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "PAIRING_CHANNEL"
class_name = "PairingChannel"

# Per-IP throttle on connections that name an existing pairing channel (both the
# app's `code` and the connector's `claim`). The per-code lockout lives in
# per-code Durable Object state, so it can't see a brute-force sweep spread one
# guess each across many codes; this edge limiter is what caps that volume.
# It is the second line of defence — the first is the code's 40 bits of entropy
# (see protocol/pairingCode.ts), which is what actually makes a sweep hopeless.
[[ratelimits]]
name = "PAIR_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

# Per-IP throttle on the mint path — an upgrade naming no channel, which is how
# a connector gets its first code. Minting is unauthenticated and persists state
# in a fresh Durable Object per attempt, so it is throttled too, but in its own
# namespace: a mint flood must not be able to spend the PAIR_LIMITER budget a
# phone on the same IP needs to finish pairing. The ceiling is low because real
# minting is rare — once at connector startup, then once per code rotation while
# nobody has paired (CODE_TTL_MS = 3 min, see src/logic.ts).
[[ratelimits]]
name = "MINT_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 5
  period = 60

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingChannel"]
