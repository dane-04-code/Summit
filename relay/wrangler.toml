name = "summit-relay"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "PAIRING_CHANNEL"
class_name = "PairingChannel"

# Per-IP throttle on connections that name an existing pairing channel (both the
# app's `code` and the connector's `claim`). The per-code lockout lives in
# per-code Durable Object state, so it can't see a brute-force sweep spread one
# guess each across many codes; this edge limiter is what caps that volume.
# It is the second line of defence — the first is the code's 40 bits of entropy
# (see protocol/pairingCode.ts), which is what actually makes a sweep hopeless.
[[ratelimits]]
name = "PAIR_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingChannel"]
